[changelog]
header = "# Changelog\n\nNotable changes to this ESP32 companion.\n\n"
body = """
{% if version %}\
## [{{ version }}]
{% else %}\
## Unreleased
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim }}
{% for commit in commits %}
- {{ commit.message | upper_first }}
{% endfor %}
{% endfor %}
"""
trim = true
render_always = true

[git]
conventional_commits = false
filter_unconventional = false
split_commits = false
commit_preprocessors = [{ pattern = '\n.*', replace = "" }]
commit_parsers = [
  { message = "^Merge", skip = true },
  { message = "^Release v", skip = true },
  { message = "(?i)fix|repair|resolve|correct", group = "Fixes" },
  { message = "(?i)add|new|create|implement|enhance|improve|support|optimi", group = "Features and improvements" },
  { message = "(?i)doc|readme|changelog", group = "Documentation" },
  { message = "(?i)test|ci|workflow|deploy|build|release", group = "Build and maintenance" },
  { message = ".*", group = "Other changes" },
]
filter_commits = false
sort_commits = "oldest"
tag_pattern = "^v[0-9]+\\.[0-9]+\\.[0-9]+$"
